<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Movimentação</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem; }
  h1 { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
  button { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; color: #333; }
  button:hover { background: #f0f0f0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .card { background: white; border-radius: 10px; padding: 1rem; text-align: center; }
  .card-label { font-size: 13px; color: #666; margin-bottom: 4px; }
  .card-value { font-size: 28px; font-weight: 500; }
  .day-section { margin-bottom: 2rem; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .day-title { font-size: 16px; font-weight: 500; }
  .day-date { font-size: 13px; color: #666; }
  .today-badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; color: #1a73e8; }
  .event { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
  .event-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .event-icon.checkin { background: #e6f4ea; color: #1e8e3e; }
  .event-icon.checkout { background: #fef7e0; color: #f29900; }
  .event-info { flex: 1; }
  .event-apt { font-size: 14px; font-weight: 500; }
  .event-detail { font-size: 13px; color: #666; margin-top: 2px; }
  .event-time { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; flex-shrink: 0; }
  .event-time.checkin { background: #e6f4ea; color: #1e8e3e; }
  .event-time.checkout { background: #fef7e0; color: #f29900; }
  .divider { border-bottom: 1px solid #eee; margin-top: 8px; }
  .empty { font-size: 14px; color: #999; padding: 8px 0; }
  .loading { text-align: center; padding: 3rem; color: #666; font-size: 16px; }
  .error { background: #fce8e6; color: #c5221f; border-radius: 8px; padding: 12px 16px; margin-bottom: 1rem; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Painel de movimentação</h1>
    <p class="subtitle">Atualizado automaticamente a cada 30 minutos</p>
  </div>
  <button onclick="loadData()">↻ Atualizar</button>
</div>

<div id="error-msg" class="error" style="display:none;"></div>
<div id="loading" class="loading">Carregando reservas...</div>
<div id="content" style="display:none;"></div>

<script>
const CLIENT_ID = 'fda28ed1';
const CLIENT_SECRET = '8ae477dc';
const DOMAIN = 'dccb.stays.net';
const AUTH = 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET);

const APT_NAMES = {
  '68433bf71282bde8b6ff5ff1': '1401 Norte',
  '671d531f8796a56f531636bb': 'Apto 202',
  '69813773d5a333a4535c7707': 'Apto 303'
};

function formatDate(d) {
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function dayLabel(dateStr) {
  const today = todayStr();
  const tom = addDays(today, 1);
  const day2 = addDays(today, 2);
  const d = new Date(dateStr + 'T12:00:00Z');
  const weekdays = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  if (dateStr === today) return 'Hoje';
  if (dateStr === tom) return 'Amanhã';
  if (dateStr === day2) return weekdays[d.getUTCDay()];
  return formatDate(dateStr);
}

function aptName(id) {
  return APT_NAMES[id] || 'Apto ' + id.substring(0, 6);
}

async function fetchReservations(dateType, from, to) {
  const url = `https://${DOMAIN}/external/v1/booking/reservations?from=${from}&to=${to}&dateType=${dateType}&limit=20`;
  const r = await fetch(url, { headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' } });
  if (!r.ok) throw new Error(`Erro ${r.status}`);
  const data = await r.json();
  return Array.isArray(data) ? data : [];
}

function eventHTML(ev, type) {
  const isIn = type === 'checkin';
  const label = isIn ? 'Check-in' : 'Check-out';
  const time = isIn ? ev.checkInTime : ev.checkOutTime;
  const guests = ev.guests || '—';
  const icon = isIn ? '→' : '←';

  return `
    <div class="event">
      <div class="event-icon ${type}">${icon}</div>
      <div class="event-info">
        <div class="event-apt">${aptName(ev._idlisting)}</div>
        <div class="event-detail">${label} · ${guests} hóspede${guests != 1 ? 's' : ''}</div>
      </div>
      <span class="event-time ${type}">${time || '—'}</span>
    </div>`;
}

function daySection(dateStr, checkouts, checkins) {
  const isToday = dateStr === todayStr();
  const label = dayLabel(dateStr);
  const hasEvents = checkouts.length > 0 || checkins.length > 0;

  let html = `
    <div class="day-section">
      <div class="day-header">
        <span class="day-title">${label}</span>
        <span class="day-date">${formatDate(dateStr)}</span>
        ${isToday ? '<span class="today-badge">hoje</span>' : ''}
      </div>`;

  if (!hasEvents) {
    html += `<p class="empty">Nenhuma movimentação</p>`;
  } else {
    checkouts.forEach(ev => { html += eventHTML(ev, 'checkout'); });
    checkins.forEach(ev => { html += eventHTML(ev, 'checkin'); });
  }

  html += `<div class="divider"></div></div>`;
  return html;
}

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';

  try {
    const today = todayStr();
    const d1 = addDays(today, 1);
    const d2 = addDays(today, 2);

    const [co0, ci0, co1, ci1, co2, ci2] = await Promise.all([
      fetchReservations('departure', today, today),
      fetchReservations('arrival', today, today),
      fetchReservations('departure', d1, d1),
      fetchReservations('arrival', d1, d1),
      fetchReservations('departure', d2, d2),
      fetchReservations('arrival', d2, d2),
    ]);

    const total = co0.length + ci0.length + co1.length + ci1.length + co2.length + ci2.length;

    let html = `
      <div class="cards">
        <div class="card">
          <div class="card-label">Check-outs hoje</div>
          <div class="card-value">${co0.length}</div>
        </div>
        <div class="card">
          <div class="card-label">Check-ins hoje</div>
          <div class="card-value">${ci0.length}</div>
        </div>
        <div class="card">
          <div class="card-label">Próximos 3 dias</div>
          <div class="card-value">${total}</div>
        </div>
      </div>`;

    html += daySection(today, co0, ci0);
    html += daySection(d1, co1, ci1);
    html += daySection(d2, co2, ci2);

    document.getElementById('content').innerHTML = html;
    document.getElementById('content').style.display = 'block';
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Erro ao carregar: ' + e.message + '. Verifique se está rodando via servidor local.';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
