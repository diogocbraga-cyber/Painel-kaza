<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Kaza Capixaba</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; padding: 1rem; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; flex-shrink: 0; }
  .logo { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #e0e0e0; }
  .clock { font-size: 14px; color: #aaa; }
  button { font-size: 12px; padding: 5px 12px; border: 1px solid #444; border-radius: 6px; background: transparent; cursor: pointer; color: #aaa; }
  button:hover { background: #333; color: #fff; }
  .grid { display: grid; grid-template-columns: 180px repeat(3, 1fr); gap: 8px; flex: 1; overflow: hidden; }
  .col-header { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; padding: 10px; }
  .col-header .day-name { font-size: 15px; font-weight: 600; }
  .col-header .day-date { font-size: 12px; color: #aaa; margin-top: 2px; }
  .col-header.today { background: #16213e; border: 1px solid #0f3460; }
  .col-header.other { background: #16213e; border: 1px solid #2a2a4a; }
  .apt-name { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 10px; border-radius: 10px; background: #16213e; border: 1px solid #2a2a4a; }
  .apt-building { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .apt-unit { font-size: 15px; font-weight: 600; color: #e0e0e0; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; background: #16213e; border: 1px solid #2a2a4a; gap: 6px; padding: 8px; }
  .cell.today-col { border-color: #0f3460; }
  .cell.empty { opacity: 0.3; }
  .event { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; }
  .arrow-out { font-size: 22px; color: #ff6b6b; line-height: 1; }
  .arrow-in { font-size: 22px; color: #51cf66; line-height: 1; }
  .event-time { font-size: 12px; color: #ddd; display: flex; align-items: center; gap: 3px; }
  .event-guests { font-size: 12px; color: #ddd; display: flex; align-items: center; gap: 3px; }
  .divider { width: 60%; height: 1px; background: #2a2a4a; }
  .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #aaa; z-index: 100; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #51cf66; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">Carregando...</div>

<div class="top">
  <div class="logo">&#127968; Kaza Capixaba</div>
  <div class="clock"><span class="dot"></span><span id="clock-time"></span></div>
  <button onclick="loadData()">&#8635; Atualizar</button>
</div>

<div id="grid" class="grid"></div>

<script>
var AUTH = 'Basic ' + btoa('fda28ed1:8ae477dc');
var DOMAIN = 'dccb.stays.net';

var APTS = [
  { id: '5ab8f8a2f6b2dc2e97f97050', building: 'Enjoy', unit: '1401 Norte' },
  { id: '67578f32e313eeaba1c28d5e', building: 'Enjoy', unit: '1306 Norte' },
  { id: '699caf1811715db71e25151d', building: 'Enjoy', unit: '1003 Sul' },
  { id: '69813773d5a333a4535c7707', building: 'Enjoy', unit: '806 Sul' },
  { id: '69c583ba4c589645828a2351', building: 'Enjoy', unit: '203 Sul' },
  { id: '671d529a8796a56f531629bb', building: 'Wave', unit: '1202 Norte' },
  { id: '671d531f8796a56f531636bb', building: 'Wave', unit: '1202 Norte B' }
];

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function addDays(dateStr, n) {
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function formatDate(d) {
  var parts = d.split('-');
  return parts[2] + '/' + parts[1];
}

function dayName(dateStr) {
  var today = todayStr();
  var d = new Date(dateStr + 'T12:00:00Z');
  var names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  if (dateStr === today) return 'Hoje';
  if (dateStr === addDays(today, 1)) return 'Amanha';
  return names[d.getUTCDay()];
}

async function fetchWithProxy(apiUrl) {
  var proxies = [
    'https://corsproxy.io/?' + encodeURIComponent(apiUrl),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl)
  ];
  for (var i = 0; i < proxies.length; i++) {
    try {
      var r = await fetch(proxies[i], { headers: { 'Authorization': AUTH } });
      if (!r.ok) continue;
      var data = await r.json();
      return Array.isArray(data) ? data : [];
    } catch(e) { continue; }
  }
  return [];
}

function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-time').textContent = h + ':' + m;
}

async function loadData() {
  var today = todayStr();
  var d1 = addDays(today, 1);
  var d2 = addDays(today, 2);
  var days = [today, d1, d2];

  var results = await Promise.all([
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + today + '&to=' + today + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + today + '&to=' + today + '&dateType=arrival&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d1 + '&to=' + d1 + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d1 + '&to=' + d1 + '&dateType=arrival&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d2 + '&to=' + d2 + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d2 + '&to=' + d2 + '&dateType=arrival&limit=20')
  ]);

  var data = [
    { out: results[0], inn: results[1] },
    { out: results[2], inn: results[3] },
    { out: results[4], inn: results[5] }
  ];

  var grid = document.getElementById('grid');
  var html = '';

  var aptHeight = 'calc((100vh - 80px) / ' + (APTS.length + 1) + ')';

  html += '<div class="col-header" style="height:' + aptHeight + '"></div>';
  for (var d = 0; d < 3; d++) {
    var isToday = d === 0;
    html += '<div class="col-header ' + (isToday ? 'today' : 'other') + '" style="height:' + aptHeight + '">' +
      '<div class="day-name">' + dayName(days[d]) + '</div>' +
      '<div class="day-date">' + formatDate(days[d]) + '</div>' +
    '</div>';
  }

  for (var a = 0; a < APTS.length; a++) {
    var apt = APTS[a];
    html += '<div class="apt-name" style="height:' + aptHeight + '">' +
      '<div class="apt-building">' + apt.building + '</div>' +
      '<div class="apt-unit">' + apt.unit + '</div>' +
    '</div>';

    for (var d = 0; d < 3; d++) {
      var checkout = null, checkin = null;
      for (var k = 0; k < data[d].out.length; k++) {
        if (data[d].out[k]._idlisting === apt.id) { checkout = data[d].out[k]; break; }
      }
      for (var k = 0; k < data[d].inn.length; k++) {
        if (data[d].inn[k]._idlisting === apt.id) { checkin = data[d].inn[k]; break; }
      }

      var isEmpty = !checkout && !checkin;
      var cellClass = 'cell' + (d === 0 ? ' today-col' : '') + (isEmpty ? ' empty' : '');
      html += '<div class="' + cellClass + '" style="height:' + aptHeight + '">';

      if (checkout) {
        html += '<div class="event">' +
          '<div class="arrow-out">&#8679;</div>' +
          '<div class="event-time">&#128336; ' + (checkout.checkOutTime || '--') + '</div>' +
        '</div>';
      }

      if (checkout && checkin) {
        html += '<div class="divider"></div>';
      }

      if (checkin) {
        html += '<div class="event">' +
          '<div class="arrow-in">&#8681;</div>' +
          '<div class="event-time">&#128336; ' + (checkin.checkInTime || '--') + '</div>' +
          '<div class="event-guests">&#128101; ' + (checkin.guests || '--') + '</div>' +
        '</div>';
      }

      if (isEmpty) {
        html += '<div style="font-size:18px; color:#333;">&#8212;</div>';
      }

      html += '</div>';
    }
  }

  grid.innerHTML = html;
  document.getElementById('loading-overlay').style.display = 'none';
}

updateClock();
setInterval(updateClock, 1000);
loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
