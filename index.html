<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Painel Kaza Capixaba</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 0.4rem;
    gap: 0.3rem;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 0 0.2rem;
  }
  .logo { font-size: clamp(11px, 2vw, 18px); font-weight: 600; color: #e0e0e0; }
  .clock { font-size: clamp(10px, 1.8vw, 15px); color: #aaa; display: flex; align-items: center; gap: 5px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #51cf66; animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .refresh-btn {
    font-size: clamp(10px, 1.5vw, 13px);
    padding: 3px 8px;
    border: 1px solid #333;
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    color: #888;
  }
  .refresh-btn:hover { color: #fff; }

  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .nav-btn {
    font-size: clamp(10px, 1.8vw, 14px);
    padding: 3px 10px;
    border: 1px solid #333;
    border-radius: 5px;
    background: #16213e;
    cursor: pointer;
    color: #ccc;
    white-space: nowrap;
  }
  .nav-btn:hover { background: #1e2d50; color: #fff; }
  .nav-dates { display: flex; gap: 5px; }
  .nav-date {
    font-size: clamp(10px, 1.6vw, 14px);
    padding: 3px 10px;
    border-radius: 5px;
    background: #16213e;
    border: 1px solid #2a2a4a;
    color: #aaa;
    white-space: nowrap;
  }
  .nav-date.active { background: #1e3a6e; border-color: #4a7adf; color: #fff; font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: minmax(80px, 18%) repeat(3, 1fr);
    gap: 4px;
    flex: 1;
    min-height: 0;
  }

  .cell-base {
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }

  .col-header {
    background: #16213e;
    border: 1px solid #222;
    flex-direction: column;
    gap: 1px;
  }
  .col-header.today { border-color: #1e3a6e; }
  .col-header .day-name { font-size: clamp(10px, 2.5vw, 18px); font-weight: 600; line-height: 1.1; }
  .col-header .day-date { font-size: clamp(9px, 1.8vw, 14px); color: #aaa; }

  .apt-name {
    background: #16213e;
    border: 1px solid #222;
    flex-direction: column;
    align-items: flex-start;
    padding: 0 6px;
    gap: 1px;
  }
  .apt-building { font-size: clamp(8px, 1.4vw, 12px); color: #777; text-transform: uppercase; letter-spacing: 0.3px; line-height: 1.1; }
  .apt-unit { font-size: clamp(10px, 2vw, 16px); font-weight: 600; color: #ddd; line-height: 1.2; }

  .data-cell {
    background: #16213e;
    border: 1px solid #222;
    flex-direction: row;
    gap: 4px;
    padding: 3px 4px;
  }
  .data-cell.today-col { border-color: #1e3a6e; }
  .data-cell.empty { opacity: 0.15; }

  .half {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex: 1;
    overflow: hidden;
    flex-wrap: nowrap;
  }
  .half-divider { width: 1px; height: 60%; background: #2a2a4a; flex-shrink: 0; }

  .arrow-out { font-size: clamp(12px, 2.5vw, 22px); color: #ff6b6b; line-height: 1; flex-shrink: 0; }
  .arrow-in  { font-size: clamp(12px, 2.5vw, 22px); color: #51cf66; line-height: 1; flex-shrink: 0; }
  .info-line {
    font-size: clamp(9px, 1.8vw, 17px);
    color: #ccc;
    display: flex;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
    overflow: hidden;
  }
  .dash { font-size: clamp(12px, 2vw, 20px); color: #2a2a4a; }
</style>
</head>
<body>

<div class="top">
  <div class="logo">&#127968; Kaza Capixaba</div>
  <div class="clock"><div class="dot"></div><span id="clock-time"></span></div>
  <button class="refresh-btn" onclick="loadData()">&#8635;</button>
</div>

<div class="nav">
  <button class="nav-btn" onclick="shiftDays(-1)">&#8592;</button>
  <div class="nav-dates" id="nav-dates"></div>
  <button class="nav-btn" onclick="shiftDays(1)">&#8594;</button>
</div>

<div id="grid" class="grid"></div>

<script>
var AUTH = 'Basic ' + btoa('fda28ed1:8ae477dc');
var DOMAIN = 'dccb.stays.net';
var offset = 0;

var APTS = [
  { id: '671d529a8796a56f531629bb', building: 'Wave', unit: '1202 Norte' },
  { id: '671d531f8796a56f531636bb', building: 'Ilha de Paros', unit: '404' },
  { id: '67578f32e313eeaba1c28d5e', building: 'Enjoy', unit: '1306 Norte' },
  { id: '68433bf71282bde8b6ff5ff1', building: 'Enjoy', unit: '1401 Norte' },
  { id: '699caf1811715db71e25151d', building: 'Enjoy', unit: '1003 Sul' },
  { id: '69813773d5a333a4535c7707', building: 'Enjoy', unit: '806 Sul' },
  { id: '69c583ba4c589645828a2351', building: 'Enjoy', unit: '203 Sul' }
];

function todayStr() {
  var now = new Date();
  var local = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
  return local.toISOString().split('T')[0];
}

function addDays(dateStr, n) {
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function formatDate(d) {
  var p = d.split('-');
  return p[2] + '/' + p[1];
}

function dayName(dateStr) {
  var today = todayStr();
  var d = new Date(dateStr + 'T12:00:00Z');
  var names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  if (dateStr === today) return 'Hoje';
  if (dateStr === addDays(today, 1)) return 'Amanha';
  if (dateStr === addDays(today, -1)) return 'Ontem';
  return names[d.getUTCDay()];
}

function shiftDays(n) {
  offset += n;
  loadData();
}

async function fetchWithProxy(apiUrl) {
  var proxies = [
    'https://corsproxy.io/?' + encodeURIComponent(apiUrl),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl)
  ];
  for (var i = 0; i < proxies.length; i++) {
    try {
      var r = await fetch(proxies[i], { headers: { 'Authorization': AUTH } });
      if (!r.ok) continue;
      var data = await r.json();
      return Array.isArray(data) ? data : [];
    } catch(e) { continue; }
  }
  return [];
}

function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-time').textContent = h + ':' + m;
}

async function loadData() {
  var today = todayStr();
  var base = addDays(today, offset);
  var days = [base, addDays(base,1), addDays(base,2)];

  var navHtml = '';
  for (var i = 0; i < 3; i++) {
    navHtml += '<div class="nav-date' + (i===0?' active':'') + '">' + dayName(days[i]) + ' ' + formatDate(days[i]) + '</div>';
  }
  document.getElementById('nav-dates').innerHTML = navHtml;

  var results = await Promise.all([
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[0]+'&to='+days[0]+'&dateType=departure&limit=20'),
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[0]+'&to='+days[0]+'&dateType=arrival&limit=20'),
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[1]+'&to='+days[1]+'&dateType=departure&limit=20'),
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[1]+'&to='+days[1]+'&dateType=arrival&limit=20'),
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[2]+'&to='+days[2]+'&dateType=departure&limit=20'),
    fetchWithProxy('https://'+DOMAIN+'/external/v1/booking/reservations?from='+days[2]+'&to='+days[2]+'&dateType=arrival&limit=20')
  ]);

  var data = [
    { out: results[0], inn: results[1] },
    { out: results[2], inn: results[3] },
    { out: results[4], inn: results[5] }
  ];

  var totalRows = APTS.length + 1;
  var rowH = 'calc((100vh - 70px) / ' + totalRows + ')';

  var grid = document.getElementById('grid');
  var html = '<div class="cell-base col-header" style="height:'+rowH+'"></div>';

  for (var d = 0; d < 3; d++) {
    var isToday = days[d] === today;
    html += '<div class="cell-base col-header'+(isToday?' today':'')+'" style="height:'+rowH+'">' +
      '<div class="day-name">'+dayName(days[d])+'</div>' +
      '<div class="day-date">'+formatDate(days[d])+'</div>' +
    '</div>';
  }

  for (var a = 0; a < APTS.length; a++) {
    var apt = APTS[a];
    html += '<div class="cell-base apt-name" style="height:'+rowH+'">' +
      '<div class="apt-building">'+apt.building+'</div>' +
      '<div class="apt-unit">'+apt.unit+'</div>' +
    '</div>';

    for (var d = 0; d < 3; d++) {
      var checkout = null, checkin = null;
      for (var k = 0; k < data[d].out.length; k++) {
        if (data[d].out[k]._idlisting === apt.id) { checkout = data[d].out[k]; break; }
      }
      for (var k = 0; k < data[d].inn.length; k++) {
        if (data[d].inn[k]._idlisting === apt.id) { checkin = data[d].inn[k]; break; }
      }

      var isEmpty = !checkout && !checkin;
      var cls = 'cell-base data-cell' + (days[d]===today?' today-col':'') + (isEmpty?' empty':'');
      html += '<div class="'+cls+'" style="height:'+rowH+'">';

      if (checkout) {
        html += '<div class="half">' +
          '<span class="arrow-out">&#8679;</span>' +
          '<span class="info-line">&#128336;&nbsp;'+(checkout.checkOutTime||'--')+'</span>' +
        '</div>';
      }

      if (checkout && checkin) html += '<div class="half-divider"></div>';

      if (checkin) {
        html += '<div class="half">' +
          '<span class="arrow-in">&#8681;</span>' +
          '<span class="info-line">&#128336;&nbsp;'+(checkin.checkInTime||'--')+'</span>' +
          '<span class="info-line">&#128101;&nbsp;'+(checkin.guests||'--')+'</span>' +
        '</div>';
      }

      if (isEmpty) html += '<div class="dash">&#8212;</div>';

      html += '</div>';
    }
  }

  grid.innerHTML = html;
}

updateClock();
setInterval(updateClock, 1000);
loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
