<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Movimentacao</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem; }
  h1 { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
  button { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; color: #333; }
  button:hover { background: #f0f0f0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .card { background: white; border-radius: 10px; padding: 1rem; text-align: center; }
  .card-label { font-size: 13px; color: #666; margin-bottom: 4px; }
  .card-value { font-size: 28px; font-weight: 500; }
  .day-section { margin-bottom: 2rem; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .day-title { font-size: 16px; font-weight: 500; }
  .day-date { font-size: 13px; color: #666; }
  .today-badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; color: #1a73e8; }
  .event { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
  .event-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .event-icon.checkin { background: #e6f4ea; color: #1e8e3e; }
  .event-icon.checkout { background: #fef7e0; color: #f29900; }
  .event-info { flex: 1; }
  .event-apt { font-size: 14px; font-weight: 500; }
  .event-detail { font-size: 13px; color: #666; margin-top: 2px; }
  .event-time { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; flex-shrink: 0; }
  .event-time.checkin { background: #e6f4ea; color: #1e8e3e; }
  .event-time.checkout { background: #fef7e0; color: #f29900; }
  .divider { border-bottom: 1px solid #eee; margin-top: 8px; }
  .empty { font-size: 14px; color: #999; padding: 8px 0; }
  .loading { text-align: center; padding: 3rem; color: #666; font-size: 16px; }
  .error { background: #fce8e6; color: #c5221f; border-radius: 8px; padding: 12px 16px; margin-bottom: 1rem; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Painel de movimentacao</h1>
    <p class="subtitle">Atualizado automaticamente a cada 30 minutos</p>
  </div>
  <button onclick="loadData()">Atualizar</button>
</div>

<div id="error-msg" class="error" style="display:none;"></div>
<div id="loading" class="loading">Carregando reservas...</div>
<div id="content" style="display:none;"></div>

<script>
var CLIENT_ID = 'fda28ed1';
var CLIENT_SECRET = '8ae477dc';
var DOMAIN = 'dccb.stays.net';
var AUTH = 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET);

var APT_NAMES = {
  '68433bf71282bde8b6ff5ff1': '1401 Norte',
  '671d531f8796a56f531636bb': 'Apto 202',
  '69813773d5a333a4535c7707': 'Apto 303'
};

function formatDate(d) {
  var parts = d.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function addDays(dateStr, n) {
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function dayLabel(dateStr) {
  var today = todayStr();
  var tom = addDays(today, 1);
  var day2 = addDays(today, 2);
  var d = new Date(dateStr + 'T12:00:00Z');
  var weekdays = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  if (dateStr === today) return 'Hoje';
  if (dateStr === tom) return 'Amanha';
  if (dateStr === day2) return weekdays[d.getUTCDay()];
  return formatDate(dateStr);
}

function aptName(id) {
  return APT_NAMES[id] || 'Apto ' + id.substring(0, 6);
}

async function fetchWithProxy(apiUrl) {
  var proxies = [
    'https://corsproxy.io/?' + encodeURIComponent(apiUrl),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(apiUrl)
  ];
  var lastError = '';
  for (var i = 0; i < proxies.length; i++) {
    try {
      var r = await fetch(proxies[i], {
        headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' }
      });
      if (!r.ok) { lastError = 'HTTP ' + r.status; continue; }
      var data = await r.json();
      return data;
    } catch(e) {
      lastError = e.message;
    }
  }
  throw new Error('Falha: ' + lastError);
}

async function fetchReservations(dateType, from, to) {
  var apiUrl = 'https://' + DOMAIN + '/external/v1/booking/reservations?from=' + from + '&to=' + to + '&dateType=' + dateType + '&limit=20';
  var data = await fetchWithProxy(apiUrl);
  return Array.isArray(data) ? data : [];
}

function eventHTML(ev, type) {
  var isIn = type === 'checkin';
  var label = isIn ? 'Check-in' : 'Check-out';
  var time = isIn ? ev.checkInTime : ev.checkOutTime;
  var guests = ev.guests || 0;
  var icon = isIn ? '>' : '<';

  return '<div class="event">' +
    '<div class="event-icon ' + type + '">' + icon + '</div>' +
    '<div class="event-info">' +
      '<div class="event-apt">' + aptName(ev._idlisting) + '</div>' +
      '<div class="event-detail">' + label + ' - ' + guests + ' hospede' + (guests != 1 ? 's' : '') + '</div>' +
    '</div>' +
    '<span class="event-time ' + type + '">' + (time || '--') + '</span>' +
  '</div>';
}

function daySection(dateStr, checkouts, checkins) {
  var isToday = dateStr === todayStr();
  var label = dayLabel(dateStr);
  var hasEvents = checkouts.length > 0 || checkins.length > 0;

  var html = '<div class="day-section">' +
    '<div class="day-header">' +
      '<span class="day-title">' + label + '</span>' +
      '<span class="day-date">' + formatDate(dateStr) + '</span>' +
      (isToday ? '<span class="today-badge">hoje</span>' : '') +
    '</div>';

  if (!hasEvents) {
    html += '<p class="empty">Nenhuma movimentacao</p>';
  } else {
    for (var i = 0; i < checkouts.length; i++) { html += eventHTML(checkouts[i], 'checkout'); }
    for (var j = 0; j < checkins.length; j++) { html += eventHTML(checkins[j], 'checkin'); }
  }

  html += '<div class="divider"></div></div>';
  return html;
}

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';

  try {
    var today = todayStr();
    var d1 = addDays(today, 1);
    var d2 = addDays(today, 2);

    var results = await Promise.all([
      fetchReservations('departure', today, today),
      fetchReservations('arrival', today, today),
      fetchReservations('departure', d1, d1),
      fetchReservations('arrival', d1, d1),
      fetchReservations('departure', d2, d2),
      fetchReservations('arrival', d2, d2)
    ]);

    var co0 = results[0], ci0 = results[1];
    var co1 = results[2], ci1 = results[3];
    var co2 = results[4], ci2 = results[5];
    var total = co0.length + ci0.length + co1.length + ci1.length + co2.length + ci2.length;

    var html = '<div class="cards">' +
      '<div class="card"><div class="card-label">Check-outs hoje</div><div class="card-value">' + co0.length + '</div></div>' +
      '<div class="card"><div class="card-label">Check-ins hoje</div><div class="card-value">' + ci0.length + '</div></div>' +
      '<div class="card"><div class="card-label">Proximos 3 dias</div><div class="card-value">' + total + '</div></div>' +
    '</div>';

    html += daySection(today, co0, ci0);
    html += daySection(d1, co1, ci1);
    html += daySection(d2, co2, ci2);

    document.getElementById('content').innerHTML = html;
    document.getElementById('content').style.display = 'block';
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Erro ao carregar: ' + e.message;
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
