<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Kaza Capixaba</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; display: flex; flex-direction: column; padding: 0.5rem; gap: 0.4rem; }
  .top { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .logo { font-size: 16px; font-weight: 600; color: #e0e0e0; }
  .clock { font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #51cf66; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .nav { display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }
  .nav button { font-size: 13px; padding: 4px 12px; border: 1px solid #333; border-radius: 6px; background: #16213e; cursor: pointer; color: #ccc; }
  .nav button:hover { background: #1e2d50; color: #fff; }
  .nav-dates { display: flex; gap: 6px; }
  .nav-date { font-size: 13px; padding: 4px 14px; border-radius: 6px; background: #16213e; border: 1px solid #2a2a4a; color: #aaa; cursor: pointer; transition: all 0.2s; }
  .nav-date.active { background: #1e3a6e; border-color: #4a7adf; color: #fff; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 150px repeat(3, 1fr); gap: 5px; flex: 1; overflow: hidden; }
  .col-header { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; padding: 6px; }
  .col-header.today { background: #16213e; border: 1px solid #1e3a6e; }
  .col-header.other { background: #16213e; border: 1px solid #222; }
  .col-header .day-name { font-size: 16px; font-weight: 600; }
  .col-header .day-date { font-size: 12px; color: #aaa; margin-top: 1px; }
  .apt-name { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 8px; border-radius: 8px; background: #16213e; border: 1px solid #222; }
  .apt-building { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
  .apt-unit { font-size: 15px; font-weight: 600; color: #ddd; }
  .cell { display: flex; flex-direction: row; align-items: center; justify-content: center; border-radius: 8px; background: #16213e; border: 1px solid #222; gap: 8px; padding: 6px 8px; }
  .cell.today-col { border-color: #1e3a6e; }
  .cell.empty { opacity: 0.2; }
  .half { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: 1; }
  .half-divider { width: 1px; height: 70%; background: #2a2a4a; flex-shrink: 0; }
  .arrow-out { font-size: 24px; color: #ff6b6b; line-height: 1; }
  .arrow-in { font-size: 24px; color: #51cf66; line-height: 1; }
  .info-line { font-size: 19px; color: #ccc; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .dash { font-size: 20px; color: #333; }
  .refresh-btn { font-size: 12px; padding: 4px 10px; border: 1px solid #333; border-radius: 6px; background: transparent; cursor: pointer; color: #888; }
  .refresh-btn:hover { color: #fff; }
</style>
</head>
<body>

<div class="top">
  <div class="logo">&#127968; Kaza Capixaba</div>
  <div class="clock"><div class="dot"></div><span id="clock-time"></span></div>
  <button class="refresh-btn" onclick="loadData()">&#8635; Atualizar</button>
</div>

<div class="nav">
  <button onclick="shiftDays(-1)">&#8592; Anterior</button>
  <div class="nav-dates" id="nav-dates"></div>
  <button onclick="shiftDays(1)">Proximo &#8594;</button>
</div>

<div id="grid" class="grid"></div>

<script>
var AUTH = 'Basic ' + btoa('fda28ed1:8ae477dc');
var DOMAIN = 'dccb.stays.net';
var offset = 0;

var APTS = [
  { id: '671d529a8796a56f531629bb', building: 'Wave', unit: '1202 Norte' },
  { id: '671d531f8796a56f531636bb', building: 'Ilha de Paros', unit: '404' },
  { id: '67578f32e313eeaba1c28d5e', building: 'Enjoy', unit: '1306 Norte' },
  { id: '68433bf71282bde8b6ff5ff1', building: 'Enjoy', unit: '1401 Norte' },
  { id: '699caf1811715db71e25151d', building: 'Enjoy', unit: '1003 Sul' },
  { id: '69813773d5a333a4535c7707', building: 'Enjoy', unit: '806 Sul' },
  { id: '69c583ba4c589645828a2351', building: 'Enjoy', unit: '203 Sul' }
];

function todayStr() {
  var now = new Date();
  var local = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
  return local.toISOString().split('T')[0];
}

function addDays(dateStr, n) {
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function formatDate(d) {
  var p = d.split('-');
  return p[2] + '/' + p[1];
}

function dayName(dateStr) {
  var today = todayStr();
  var d = new Date(dateStr + 'T12:00:00Z');
  var names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  if (dateStr === today) return 'Hoje';
  if (dateStr === addDays(today, 1)) return 'Amanha';
  if (dateStr === addDays(today, -1)) return 'Ontem';
  return names[d.getUTCDay()];
}

function shiftDays(n) {
  offset += n;
  loadData();
}

async function fetchWithProxy(apiUrl) {
  var proxies = [
    'https://corsproxy.io/?' + encodeURIComponent(apiUrl),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl)
  ];
  for (var i = 0; i < proxies.length; i++) {
    try {
      var r = await fetch(proxies[i], { headers: { 'Authorization': AUTH } });
      if (!r.ok) continue;
      var data = await r.json();
      return Array.isArray(data) ? data : [];
    } catch(e) { continue; }
  }
  return [];
}

function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-time').textContent = h + ':' + m;
}

async function loadData() {
  var today = todayStr();
  var base = addDays(today, offset);
  var d0 = base;
  var d1 = addDays(base, 1);
  var d2 = addDays(base, 2);
  var days = [d0, d1, d2];

  var navHtml = '';
  for (var i = 0; i < 3; i++) {
    navHtml += '<div class="nav-date' + (i === 0 ? ' active' : '') + '">' + dayName(days[i]) + ' ' + formatDate(days[i]) + '</div>';
  }
  document.getElementById('nav-dates').innerHTML = navHtml;

  var results = await Promise.all([
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d0 + '&to=' + d0 + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d0 + '&to=' + d0 + '&dateType=arrival&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d1 + '&to=' + d1 + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d1 + '&to=' + d1 + '&dateType=arrival&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d2 + '&to=' + d2 + '&dateType=departure&limit=20'),
    fetchWithProxy('https://' + DOMAIN + '/external/v1/booking/reservations?from=' + d2 + '&to=' + d2 + '&dateType=arrival&limit=20')
  ]);

  var data = [
    { out: results[0], inn: results[1] },
    { out: results[2], inn: results[3] },
    { out: results[4], inn: results[5] }
  ];

  var totalRows = APTS.length + 1;
  var aptH = 'calc((100vh - 80px) / ' + totalRows + ')';

  var grid = document.getElementById('grid');
  var html = '<div class="col-header" style="height:' + aptH + '"></div>';

  for (var d = 0; d < 3; d++) {
    var isToday = days[d] === today;
    html += '<div class="col-header ' + (isToday ? 'today' : 'other') + '" style="height:' + aptH + '">' +
      '<div class="day-name">' + dayName(days[d]) + '</div>' +
      '<div class="day-date">' + formatDate(days[d]) + '</div>' +
    '</div>';
  }

  for (var a = 0; a < APTS.length; a++) {
    var apt = APTS[a];
    html += '<div class="apt-name" style="height:' + aptH + '">' +
      '<div class="apt-building">' + apt.building + '</div>' +
      '<div class="apt-unit">' + apt.unit + '</div>' +
    '</div>';

    for (var d = 0; d < 3; d++) {
      var checkout = null, checkin = null;
      for (var k = 0; k < data[d].out.length; k++) {
        if (data[d].out[k]._idlisting === apt.id) { checkout = data[d].out[k]; break; }
      }
      for (var k = 0; k < data[d].inn.length; k++) {
        if (data[d].inn[k]._idlisting === apt.id) { checkin = data[d].inn[k]; break; }
      }

      var isEmpty = !checkout && !checkin;
      var cellClass = 'cell' + (days[d] === today ? ' today-col' : '') + (isEmpty ? ' empty' : '');
      html += '<div class="' + cellClass + '" style="height:' + aptH + '">';

      if (checkout) {
        html += '<div class="half">' +
          '<div class="arrow-out">&#8679;</div>' +
          '<div class="info-line">&#128336; ' + (checkout.checkOutTime || '--') + '</div>' +
        '</div>';
      }

      if (checkout && checkin) {
        html += '<div class="half-divider"></div>';
      }

      if (checkin) {
        html += '<div class="half">' +
          '<div class="arrow-in">&#8681;</div>' +
          '<div class="info-line">&#128336; ' + (checkin.checkInTime || '--') + '</div>' +
          '<div class="info-line">&#128101; ' + (checkin.guests || '--') + '</div>' +
        '</div>';
      }

      if (isEmpty) {
        html += '<div class="dash">&#8212;</div>';
      }

      html += '</div>';
    }
  }

  grid.innerHTML = html;
}

updateClock();
setInterval(updateClock, 1000);
loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
